name: Security and QA regression tests

on:
  pull_request:
  push:
    branches:
      - main
      - fix/security-and-qa-hardening
      - fix/purchase-reliability-and-token-storage

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run non-destructive regression tests
        run: npm run test:security
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check React Native application
        run: npx tsc --noEmit

  android-media-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile Android download bridge and merge release manifest
        working-directory: android
        run: bash gradlew :app:compileDebugKotlin :app:processReleaseMainManifest --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Verify final release permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          android = "{http://schemas.android.com/apk/res/android}"
          blocked = {"READ_MEDIA_IMAGES", "READ_MEDIA_VIDEO", "READ_MEDIA_VISUAL_USER_SELECTED", "ACCESS_MEDIA_LOCATION"}
          manifests = [p for p in Path("android/app/build/intermediates").rglob("AndroidManifest.xml")
                       if "release" in p.parts and any(part in {"merged_manifest", "merged_manifests"} for part in p.parts)]
          assert manifests, "Release merged manifest was not generated"
          for path in manifests:
              permissions = ET.parse(path).getroot().findall("uses-permission")
              for permission in permissions:
                  name = permission.get(android + "name", "").split(".")[-1]
                  assert name not in blocked, f"{path}: unexpected {name}"
                  if name in {"READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE"}:
                      assert permission.get(android + "maxSdkVersion") == "28", f"{path}: legacy storage extends beyond Android 9"
          print("Release manifest excludes broad photo/video access; legacy storage is Android 9 and below.")
          PY
